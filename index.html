<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16100c">
<meta name="robots" content="noindex, nofollow">
<meta name="google" content="notranslate">
<title>Forfaits Danz Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: même univers que danzfilm.com. Barre fixe avec logo, timecode et drapeaux; ouverture avec viseur; pile de cartes à faire glisser, le prix descend en jaune au survol ou sur le +; bloc doré final avec rouleau de pellicule; contact en icônes. */
:root {
  --bg: #16100c;
  --surface: #221913;
  --line: #3b2f25;
  --fg: #FCECCF;
  --muted: #AEA38F;
  --accent: #F0A81E;
  --leak: rgba(240, 168, 30, 0.16);
  --rec: #e5412d;
  --display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --body: "Gotham", "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 30; }
img { max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header, same as danzfilm.com */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: linear-gradient(180deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, .03)), color-mix(in srgb, var(--bg) 42%, transparent); -webkit-backdrop-filter: blur(24px) saturate(1.8) brightness(1.1); backdrop-filter: blur(24px) saturate(1.8) brightness(1.1); border-bottom: 0; box-shadow: inset 0 -1px 0 rgba(255, 255, 255, .16), 0 8px 30px rgba(0, 0, 0, .3); }
.bar .wrap { display: flex; align-items: center; gap: 24px; height: 72px; }
.mark { flex: none; display: block; line-height: 0; }
.mark .marklogo { display: block; height: 46px; background-color: var(--fg); -webkit-mask: var(--lg) center / contain no-repeat; mask: var(--lg) center / contain no-repeat; transition: background-color .2s; aspect-ratio: 600 / 246; }
.mark:hover .marklogo, .mark:focus-visible .marklogo { background-color: var(--accent); }
.rec { display: flex; align-items: center; gap: 10px; margin-left: auto; font: 500 12px/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--rec); animation: blink 1.6s steps(2, jump-none) infinite; }
.rec b { color: var(--accent); font-weight: 500; letter-spacing: 0.04em; }
@keyframes blink { 50% { opacity: 0.15; } }
.lang { display: flex; gap: 6px; align-items: center; flex: none; }
.lang button { position: relative; width: 36px; height: 36px; padding: 4px; border: 0; background: none; cursor: pointer; color: var(--muted); transition: color 0.15s; }
.lang button svg { width: 100%; height: 28px; display: block; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; }
.lang button:hover { color: var(--fg); }
.lang button[aria-pressed="true"] { color: var(--accent); }
.lang button:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.lang button svg .rc { opacity: 0; transition: opacity .18s; stroke: none; }
.lang button:hover svg .rc { opacity: 1; }
.lang button:hover svg .fill { opacity: 0; }
.lang button svg .fill { fill: currentColor; stroke: none; }
.lang button svg .fill.soft { fill-opacity: .4; }
.lang button::after { content: attr(data-tip); position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); padding: 6px 10px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); color: var(--fg); font: 600 11px/1 var(--body); letter-spacing: .08em; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 60; }
.lang button:hover::after, .lang button:focus-visible::after { opacity: 1; }
.lang button:last-child::after { left: auto; right: 0; transform: none; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); gap: clamp(24px, 5vw, 64px); align-items: center; padding-block: clamp(28px, 5vw, 56px) clamp(56px, 9vw, 110px); }
.hero-text { display: flex; flex-direction: column; align-items: flex-start; gap: 22px; min-width: 0; }
.eyebrow { margin: 0; font: 500 12px/1.4 var(--body); letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
h1 { font: 400 clamp(38px, 11vw, 124px)/0.9 var(--display); text-transform: uppercase; margin: 0; color: var(--accent); text-wrap: balance; min-width: 0; }
h1 span { display: block; color: var(--fg); }
.lede { margin: 0; max-width: 46ch; color: var(--fg); font-size: clamp(1rem, 2.2vw, 1.12rem); }
.btns { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 15px 22px; border: 1px solid var(--fg); font: 600 12px/1 var(--body); letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; cursor: pointer; background: none; border-radius: 10px; transition: background .15s, color .15s, border-color .15s; }
.btn:hover { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.btn.solid { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.btn.solid:hover { background: var(--fg); border-color: var(--fg); }
.btn svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.frame { position: relative; margin: 0; background: #472F22; min-width: 0; border-radius: 16px; overflow: hidden; }
.frame img { display: block; width: 100%; height: auto; max-height: 640px; object-fit: cover; object-position: 55% 40%; }
.frame::before, .frame::after, .frame i::before, .frame i::after { content: ""; position: absolute; width: 26px; height: 26px; border: 0 solid var(--fg); opacity: 0.85; pointer-events: none; }
.frame::before { top: 14px; left: 14px; border-top-width: 1px; border-left-width: 1px; }
.frame::after { top: 14px; right: 14px; border-top-width: 1px; border-right-width: 1px; }
.frame i::before { bottom: 14px; left: 14px; border-bottom-width: 1px; border-left-width: 1px; }
.frame i::after { bottom: 14px; right: 14px; border-bottom-width: 1px; border-right-width: 1px; }
.frame figcaption { position: absolute; left: 50px; bottom: 17px; font: 500 11px/1 var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg); text-shadow: 0 1px 6px rgba(0,0,0,.7); }

/* clapperboard click */
.clap { position: fixed; z-index: 9999; width: 44px; height: 44px; margin: -6px 0 0 -6px; pointer-events: none; opacity: 0; color: var(--accent); }
.clap svg { display: block; overflow: visible; stroke: currentColor; stroke-width: 2.4; filter: drop-shadow(0 2px 6px rgba(0,0,0,.6)); }
.clap .clap-arm { transform-box: fill-box; transform-origin: 0% 100%; }
.clap.go { animation: clapShow .52s ease-out forwards; }
.clap.go .clap-arm { animation: clapArm .52s cubic-bezier(.5,0,.8,.3) forwards; }
html.clapping, html.clapping * { cursor: none !important; }
@keyframes clapShow { 0% { opacity: 0; transform: scale(.7); } 12% { opacity: 1; transform: scale(1); } 70% { opacity: 1; } 100% { opacity: 0; transform: scale(1.05); } }
@keyframes clapArm { 0% { transform: rotate(-32deg); } 45% { transform: rotate(-32deg); } 62% { transform: rotate(0deg); } 100% { transform: rotate(0deg); } }

/* plans */
.plans { overflow-x: clip; border-top: 1px solid var(--line); padding-block: clamp(56px, 9vw, 110px) clamp(40px, 7vw, 80px); scroll-margin-top: 72px; }
h2 { font: 400 clamp(52px, 9vw, 112px)/0.9 var(--display); text-transform: uppercase; margin: 0; text-wrap: balance; }
h2 em { font-style: normal; color: var(--accent); }
.sec-head { display: flex; flex-direction: column; gap: 14px; margin-bottom: clamp(32px, 6vw, 56px); }
.sec-head p { margin: 0; color: var(--muted); max-width: 52ch; }

.pile { width: 100%; margin: 0 auto; --cw: min(620px, 78vw); }
.stack { position: relative; height: calc(var(--cw) * 0.75); margin-bottom: 44px; touch-action: pan-y; user-select: none; -webkit-user-select: none; outline-offset: 10px; }
.pcard {
  position: absolute; top: 0; left: 50%; width: var(--cw); height: 100%; margin-left: calc(var(--cw) / -2);
  border-radius: 16px; overflow: hidden;
  border: 1px solid rgba(252, 236, 207, 0.22);
  background:
    radial-gradient(60% 90% at 88% 8%, rgba(255, 214, 140, 0.22), transparent 70%),
    linear-gradient(150deg, #66543d 0%, #4a3b2b 55%, #3a2d21 100%);
  box-shadow: 0 22px 54px rgba(0, 0, 0, 0.5);
  cursor: grab; transform-origin: 50% 60%;
  --o: 0; --s: 1; --dx: 0px;
  transform: translateX(calc(var(--o) * var(--cw) * 0.76 + var(--dx))) scale(var(--s));
  transition: transform .5s cubic-bezier(.2,.8,.2,1), filter .5s, opacity .5s;
  will-change: transform; -webkit-touch-callout: none;
}
.pcard:active { cursor: grabbing; }
.pcard.nt { transition: none; }
.pcard[data-k="0"] { --o: 0; --s: 1; z-index: 4; }
.pcard[data-k="1"] { --o: 1; --s: 0.82; z-index: 3; filter: blur(3.5px) brightness(0.7); opacity: 0.85; cursor: pointer; }
.pcard[data-k="-1"] { --o: -1; --s: 0.82; z-index: 3; filter: blur(3.5px) brightness(0.7); opacity: 0.85; cursor: pointer; }
.pcard[data-k="2"] { --o: 2; --s: 0.7; z-index: 1; opacity: 0; pointer-events: none; }
.pcard:not([data-k="0"]) .pc-plus { pointer-events: none; }
.pc-face { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(20px, 4.5vw, 34px); }
.pc-face::before, .pc-face::after { content: ""; position: absolute; width: 20px; height: 20px; border: 0 solid var(--fg); opacity: 0.5; pointer-events: none; }
.pc-face::before { top: 12px; left: 12px; border-top-width: 1px; border-left-width: 1px; }
.pc-face::after { bottom: 12px; right: 12px; border-bottom-width: 1px; border-right-width: 1px; }
.pc-label { font: 600 12px/1 var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: rgba(252, 236, 207, 0.78); padding-left: 6px; padding-top: 4px; }
.pc-main { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px; padding: 0 6px 6px; }
.pc-name { font: 400 clamp(44px, 11vw, 88px)/0.85 var(--display); text-transform: uppercase; color: var(--accent); min-width: 0; }
.pc-num { text-align: right; flex: none; }
.pc-num b { display: block; font: 400 clamp(44px, 10vw, 76px)/0.85 var(--display); color: var(--fg); }
.pc-num span { display: block; margin-top: 6px; font: 600 11px/1.2 var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: rgba(252, 236, 207, 0.78); }

/* the plus button and the yellow panel that comes down with price and details */
.pc-plus { position: absolute; z-index: 3; top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: #0b0907; display: grid; place-items: center; cursor: pointer; transition: transform .3s cubic-bezier(.2,.8,.2,1), background .2s; }
.pc-plus svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.pc-plus:hover { transform: scale(1.1); }
.pc-plus.nudge { animation: plusBlink 1s ease-in-out 1; }
@keyframes plusBlink {
  0%, 100% { background: var(--accent); transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 216, 180, 0); }
  35% { background: #EAD8B4; transform: scale(1.18); box-shadow: 0 0 0 10px rgba(234, 216, 180, 0.28); }
  65% { background: #EAD8B4; transform: scale(1.1); box-shadow: 0 0 0 16px rgba(234, 216, 180, 0); }
}
.pcard.open .pc-plus { background: #0b0907; color: var(--accent); }
.pcard.open .pc-plus svg { transform: rotate(45deg); }
.pc-reveal { position: absolute; inset: 0; z-index: 2; background: var(--accent); color: #0b0907; transform: translateY(-101%); transition: transform .5s cubic-bezier(.77, 0, .18, 1); display: flex; flex-direction: column; justify-content: space-between; gap: 10px; padding: clamp(16px, 4vw, 30px); }
.pcard.open .pc-reveal { transform: none; }
.pr-k { padding-right: 52px; margin: 0; font: 700 11px/1 var(--body); letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.75; }
.pr-price { margin: 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; font-variant-numeric: tabular-nums; }
.pr-price .amt { font: 400 clamp(64px, 15vw, 104px)/0.85 var(--display); }
.pr-price .cur { font: 400 clamp(30px, 6vw, 44px)/1 var(--display); }
.pr-price .per { font: 700 12px/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.75; }
.pr-list { list-style: none; margin: 0; padding: 0; }
.pr-list li { display: flex; align-items: baseline; gap: 12px; padding: 8px 0; border-top: 1px solid rgba(11, 9, 7, 0.28); font: 600 14px/1.2 var(--body); }
.pr-list li:last-child { border-bottom: 1px solid rgba(11, 9, 7, 0.28); }
.pr-list b { font: 400 1.7rem/1 var(--display); min-width: 2ch; }
.pr-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.pr-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 10px; background: #0b0907; color: var(--fg); text-decoration: none; font: 700 12px/1 var(--body); letter-spacing: 0.1em; text-transform: uppercase; transition: background .2s, color .2s; }
.pr-btn:hover { background: var(--fg); color: #0b0907; }
.pr-btn { white-space: nowrap; }
.pr-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.pr-btn svg.wa { fill: currentColor; stroke: none; }

.pile-nav { display: flex; align-items: center; justify-content: center; gap: 18px; }
.arrow { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: none; display: grid; place-items: center; cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
.arrow:hover { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.arrow svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.arrow.prev svg { transform: scaleX(-1); }
.dots { display: flex; gap: 8px; }
.dots { gap: 0; }
.dots button { position: relative; width: 30px; height: 40px; padding: 0; border: 0; background: none; cursor: pointer; }
.dots button::before { content: ""; position: absolute; left: 10px; top: 15px; width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--muted); transition: background .2s, border-color .2s, transform .2s; }
.dots button[aria-current="true"]::before { background: var(--accent); border-color: var(--accent); transform: scale(1.25); }
.hint { text-align: center; margin: 16px 0 0; font: 500 11px/1 var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }

/* closing call to action, same block as on danzfilm.com */
.endcta { padding-block: clamp(32px, 6vw, 72px); }
.endbox { position: relative; display: grid; gap: 40px; align-items: center; background: var(--accent); color: #0b0907; border-radius: 32px; padding: clamp(28px, 5vw, 72px); overflow: hidden; }
@media (min-width: 900px) { .endbox { grid-template-columns: 1.25fr 0.75fr; gap: 64px; } }
.endtxt h2 { margin: 0 0 36px; font-size: clamp(34px, 5.4vw, 84px); line-height: 1.02; color: #0b0907; }
.endtxt h2 em { font-style: normal; background: #0b0907; color: var(--accent); padding: 0 .16em; border-radius: .14em; white-space: nowrap; }
.endbtn { position: relative; display: inline-flex; align-items: center; gap: 16px; padding: 10px 10px 10px 30px; border-radius: 999px; background: #0b0907; color: var(--fg); text-decoration: none; font: 600 15px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; transition: background .25s, color .25s, transform .25s; }
.endbtn::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 2px solid #0b0907; animation: endPulse 2.2s ease-out infinite; pointer-events: none; }
.endarr { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: #0b0907; transition: transform .35s cubic-bezier(.2,.7,.2,1), background .25s, color .25s; }
.endarr svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.endbtn:hover { background: var(--fg); color: #0b0907; transform: translateY(-3px); }
.endbtn:hover .endarr { transform: translateX(6px); background: #0b0907; color: var(--fg); }
@keyframes endPulse { 0% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(1.22, 1.5); } }
.endpic { display: grid; justify-items: center; }
.endframe { width: min(100%, 300px); aspect-ratio: 1 / 1; padding: 14px 30px; box-sizing: content-box; background: #0b0907; border-radius: 8px; position: relative; transform: rotate(3deg); transition: transform .5s cubic-bezier(.2,.7,.2,1); }
.endbox:hover .endframe { transform: rotate(0deg) scale(1.02); }
@media (max-width: 899px) { .endframe { width: min(100%, 240px); } }
/* film roll: hold the mouse or a finger on the photo and the film runs through the gate */
.endframe { cursor: grab; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: pan-y; }
.endframe.rolling { cursor: grabbing; }
.endframe::before, .endframe::after { content: ""; position: absolute; top: 8px; bottom: 8px; width: 12px; background: linear-gradient(to bottom, #FCECCF 0 11px, transparent 11px 22px) 0 var(--sp, 0px) / 12px 22px repeat-y; }
.endframe::before { left: 9px; } .endframe::after { right: 9px; }
.endframe .pic { width: 100%; height: 100%; overflow: hidden; position: relative; }
.endframe .pic img { display: block; width: 100%; height: 100%; object-fit: cover; }
.pic .reel { position: absolute; left: 0; right: 0; top: 0; will-change: transform; background: #000; }
.pic .reel .rf { overflow: hidden; background: #000; }
.pic .reel .rf img { display: block; width: 100%; height: 100%; object-fit: cover; }
.rolling .pic > img { visibility: hidden; }
.rolling .pic::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to bottom, rgba(0,0,0,.35), transparent 22%, transparent 78%, rgba(0,0,0,.35)); }

/* contact */
.contact { border-top: 1px solid var(--line); padding-block: clamp(56px, 9vw, 110px); display: flex; flex-direction: column; align-items: flex-start; gap: 36px; scroll-margin-top: 72px; }
.badge { width: clamp(150px, 26vw, 200px); height: auto; display: block; }
.icons { display: flex; flex-wrap: wrap; gap: 28px 32px; margin: 0; padding: 0; list-style: none; }
.ic { display: flex; flex-direction: column; align-items: center; gap: 12px; text-decoration: none; font: 700 12px/1 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg); }
.ic i { display: grid; place-items: center; width: 68px; height: 68px; border-radius: 50%; background: var(--accent); color: #0b0907; transition: transform .25s cubic-bezier(.2,.8,.2,1), background .2s, color .2s; }
.ic svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic svg.wa { fill: currentColor; stroke: none; }
.ic:hover i { transform: scale(1.12) rotate(-6deg); background: var(--fg); }
.ic.wa:hover i { background: #25D366; color: #fff; }

footer { border-top: 1px solid var(--line); padding-block: 28px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; color: var(--muted); font-size: 0.8rem; }
footer img { height: 30px; width: auto; display: block; }

@media (max-width: 899px) { .rec .meta, .rec b { display: none; } }
@media (max-width: 760px) { .hero { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) {
  .pile { --cw: 84vw; }
  .stack { height: calc(var(--cw) * 1.15); }
  .pr-btn { padding: 11px 9px; letter-spacing: 0.03em; font-size: 10px; gap: 6px; }
  .pr-btns { gap: 6px; }
  .pr-btn.mail span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .pr-btn.mail { padding: 11px 14px; }
  .pr-btn svg { width: 16px; height: 16px; }
  .bar .wrap { gap: 12px; }
  .lang button { width: 34px; }
  .pc-plus { width: 48px; height: 48px; top: 12px; right: 12px; }
  .pr-price .amt { font-size: clamp(54px, 16vw, 70px); }
  .pr-list li { padding: 6px 0; font-size: 13px; }
  .pr-list b { font-size: 1.5rem; }
  .pr-btn { padding: 11px 12px; font-size: 11px; letter-spacing: 0.08em; gap: 8px; }
  .pr-btns { flex-wrap: nowrap; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; }
  .dot, .endbtn::after { animation: none; }
}
</style>
</head>
<body>

  function countUp(card, plan) {

/* film roll (same as danzfilm.com): hold the mouse or a finger on the photo and the film runs through the gate */
(function () {
  var GAP = 8, state = null;
  function start(box) {
    var pic = box.querySelector('.pic'), base = pic && pic.querySelector('img');
    if (!pic || !base || state) return;
    var H = pic.clientHeight;
    var mine = [{ src: base.getAttribute('src'), z: '1' }].concat((window.ROLL_PHOTOS || []).map(function (u) { return { src: u, z: '1' }; }));
    var list = [];
    for (var i = 0; i < 6; i++) list.push(mine[i % mine.length]);
    var n = list.length;
    list.push(list[0]);
    var reel = document.createElement('div');
    reel.className = 'reel';
    reel.innerHTML = list.map(function (f) { return '<div class="rf" style="height:' + H + 'px;margin-bottom:' + GAP + 'px"><img src="' + f.src + '" alt="" style="transform:scale(' + f.z + ')"></div>'; }).join('');
    pic.appendChild(reel);
    box.classList.add('rolling');
    state = { box: box, pic: pic, reel: reel, H: H, n: n, pos: 0, v: 0, hold: true, target: 0, last: performance.now() };
    requestAnimationFrame(tick);
  }
  function paint() {
    var st = state, off = st.pos * (st.H + GAP);
    st.reel.style.transform = 'translateY(' + (-off).toFixed(1) + 'px)';
    st.box.style.setProperty('--sp', (-off % 22).toFixed(1) + 'px');
  }
  function tick(now) {
    var st = state; if (!st) return;
    var dt = Math.min(0.05, (now - st.last) / 1000); st.last = now;
    if (st.hold) {
      st.v += (1.0 - st.v) * Math.min(1, dt * 2);
      st.pos += st.v * dt;
      if (st.pos >= st.n) st.pos -= st.n;
    } else {
      if (st.rw === undefined) { st.rw = { from: st.pos, t0: now, dur: Math.min(750, 220 + st.pos * 110) }; }
      var k = Math.min(1, (now - st.rw.t0) / st.rw.dur);
      var e2 = 1 - Math.pow(1 - k, 3);
      st.pos = st.rw.from * (1 - e2);
      if (k >= 1) {
        st.pos = 0;
        paint();
        st.box.classList.remove('rolling'); st.box.style.removeProperty('--sp');
        st.reel.remove(); state = null; return;
      }
    }
    paint();
    requestAnimationFrame(tick);
  }
  function stop() { if (state && state.hold) { state.hold = false; state.target = null; } }
  document.addEventListener('pointerover', function (e) {
    if (e.pointerType === 'touch') return;
    var box = e.target.closest && e.target.closest('.endframe');
    if (box) start(box);
  });
  document.addEventListener('pointerout', function (e) {
    if (e.pointerType === 'touch') return;
    var box = e.target.closest && e.target.closest('.endframe');
    if (box && !(e.relatedTarget && box.contains(e.relatedTarget))) stop();
  });
  document.addEventListener('pointerdown', function (e) {
    if (e.pointerType !== 'touch') return;
    var box = e.target.closest && e.target.closest('.endframe');
    if (box) start(box);
  });
  ['pointerup', 'pointercancel', 'blur'].forEach(function (ev) { window.addEventListener(ev, function (e) { if (!e || e.pointerType === 'touch' || ev === 'blur') stop(); }); });
  document.addEventListener('contextmenu', function (e) { if (e.target.closest && e.target.closest('.endframe')) e.preventDefault(); });
})();

/* Clapperboard: on click the pointer turns into a clapperboard that claps and fades */
(function () {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var el = document.createElement('div');
  el.className = 'clap';
  el.setAttribute('aria-hidden', 'true');
  el.innerHTML = '<svg viewBox="0 0 48 48" width="44" height="44" fill="none" stroke-linejoin="round" stroke-linecap="round">' +
    '<g class="clap-body"><rect x="6" y="19" width="36" height="22" rx="2"/><path d="M6 26h36M15 26l-4 7M26 26l-4 7M37 26l-4 7" stroke-width="2"/></g>' +
    '<g class="clap-arm"><rect x="6" y="11" width="36" height="8" rx="2"/><path d="M14 11l-4 8M25 11l-4 8M36 11l-4 8" stroke-width="2"/></g></svg>';
  document.body.appendChild(el);
  var timer = 0;
  document.addEventListener('pointerdown', function (e) {
    if (e.button > 0) return;
    el.style.left = e.clientX + 'px';
    el.style.top = e.clientY + 'px';
    el.classList.remove('go');
    void el.offsetWidth;
    el.classList.add('go');
    document.documentElement.classList.add('clapping');
    clearTimeout(timer);
    timer = setTimeout(function () { el.classList.remove('go'); document.documentElement.classList.remove('clapping'); }, 520);
  }, true);
})();

/* the + blinks beige after 1.5 s, then every 3.5 s, until the visitor opens a price */
(function () {
  var stopped = false;
  function blink() {
    if (stopped) return;
    var c = document.querySelector('.pcard[data-k="0"]');
    var b = c && c.querySelector('.pc-plus');
    if (b && !c.classList.contains('open')) { b.classList.remove('nudge'); void b.offsetWidth; b.classList.add('nudge'); }
    setTimeout(blink, 3500);
  }
  document.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('.pc-plus')) stopped = true; }, true);
  document.addEventListener('pointerenter', function () {}, true);
  setTimeout(blink, 1500);
})();
